spring.application.name=servicios

spring.datasource.url=jdbc:postgresql://ep-long-tree-b4xey6gj.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# GestoPago - autenticación 
gestopago.auth.url=${GESTOPAGO_URL}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_PASSWORD}

# GestoPago - consulta de productos 
gestopago.api.url=${GESTOPAGO_URL}
gestopago.api.token=${GESTOPAGO_TOKEN}

# Timeouts del cliente 
spring.cloud.openfeign.client.config.gestoPagoProducts.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoProducts.read-timeout=62000